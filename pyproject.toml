[project]
name = "lingotrim"
version = "0.1.0"
description = "Trim multilingual LLMs down to the languages you actually use - losslessly and verifiably."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Ryszard Grodzicki" }]
keywords = ["llm", "tokenizer", "vocabulary", "pruning", "qwen", "compression"]
dependencies = [
    "numpy>=1.26",
    "regex>=2024.0",
    "tokenizers>=0.20",
    "huggingface_hub>=0.30",
]

[project.optional-dependencies]
corpus = ["datasets>=3.0"]
verify = ["torch>=2.4", "transformers>=4.50"]
gguf = ["torch>=2.4", "transformers>=4.50", "gguf>=0.17", "sentencepiece>=0.2", "protobuf>=4.21"]

[project.scripts]
lingotrim = "lingotrim.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
